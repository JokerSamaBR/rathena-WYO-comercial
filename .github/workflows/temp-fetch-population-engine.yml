name: TEMP - Fetch Population Engine Base

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/temp-fetch-population-engine.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Clone historical public base
        run: |
          git clone https://github.com/JokerSamaBR/Population-Engine.git source
          cd source
          git checkout 260b826eb874d5be0691a482e28f228889748a57
          rm -rf .git
          cd ..
          tar -czf population-engine-base-2026-05.tar.gz source
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: population-engine-base-2026-05
          path: population-engine-base-2026-05.tar.gz
          retention-days: 1

